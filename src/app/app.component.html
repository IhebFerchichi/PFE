<nz-layout class="app-shell">
  <nz-header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="logo.png" alt="Starz Electronics Logo" class="brand-logo" />
        <div class="brand-text">
          <div class="brand-subtitle">Battery Pack Monitoring</div>
        </div>
      </div>

        <ul nz-menu nzMode="horizontal" class="top-menu">
          <li nz-menu-item routerLink="/dashboard" routerLinkActive="ant-menu-item-selected" [routerLinkActiveOptions]="{ exact: true }">
          Dashboard
        </li>
        <li nz-menu-item routerLink="/packs" routerLinkActive="ant-menu-item-selected">
          Packs
        </li>
        <li nz-menu-item routerLink="/alerts" routerLinkActive="ant-menu-item-selected">
          Alerts
        </li>
      </ul>
    </div>
  </nz-header>

  <nz-content class="content-area">
    <div class="container">
      <router-outlet></router-outlet>
    </div>
  </nz-content>
</nz-layout>
