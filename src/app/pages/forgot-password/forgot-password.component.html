<div class="login-shell">
  <div class="login-card">
    <div class="eyebrow">Battery Platform</div>
    <h1>Forgot password</h1>
    <p class="intro">Enter your verified email address and we will send you a reset link.</p>

    <form class="login-form" (ngSubmit)="submit()">
      <label>
        <span>Email</span>
        <input [(ngModel)]="email" name="email" type="email" autocomplete="email" required />
      </label>

      <div class="success" *ngIf="info">{{ info }}</div>
      <div class="error" *ngIf="error">{{ error }}</div>

      <button type="submit" [disabled]="auth.loading()">Send reset link</button>
    </form>

    <p class="switch-auth">
      Remembered it?
      <a routerLink="/login">Back to sign in</a>
    </p>
  </div>
</div>
