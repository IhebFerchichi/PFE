<div class="login-shell">
  <div class="login-card">
    <div class="eyebrow">Battery Platform</div>
    <h1>Reset password</h1>
    <p class="intro">Choose a new password for your account.</p>

    <form class="login-form" (ngSubmit)="submit()">
      <label>
        <span>New password</span>
        <input [(ngModel)]="password" name="password" type="password" autocomplete="new-password" required />
      </label>

      <label>
        <span>Confirm password</span>
        <input [(ngModel)]="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required />
      </label>

      <div class="success" *ngIf="info">{{ info }}</div>
      <div class="error" *ngIf="error">{{ error }}</div>

      <button type="submit" [disabled]="auth.loading()">Update password</button>
    </form>

    <p class="switch-auth">
      Need a new link?
      <a routerLink="/forgot-password">Request another reset email</a>
    </p>
  </div>
</div>
